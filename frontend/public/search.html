<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>ReviewTap Search</title><link rel="stylesheet" href="/styles.css"></head><body class="rt-dashboard"><nav class="rt-topbar"><a class="logo" href="/">Review<span>Tap</span></a><div class="rt-top-actions"><a class="secondary" href="/">Home</a></div></nav><main class="rt-content" style="max-width:1200px;margin:auto"><header class="rt-page-head"><div><div class="eyebrow">PUBLIC SEARCH</div><h1>Find a ReviewTap page</h1><p class="rt-subtitle">Search by name, type, address or menu item. Select three profiles to compare.</p></div></header><section class="rt-panel"><form id="searchForm" class="rt-form"><div class="rt-form-row"><label>Search<input id="query" type="search" autocomplete="off" placeholder="Name, business or menu item"></label><label>Type<select id="type"><option value="">All types</option><option>Person</option><option>Creator</option><option>Professional</option><option>Business</option><option>Restaurant</option><option>Shop</option><option>Salon</option><option>Organization</option><option>Event</option><option>Custom</option></select></label></div><button class="primary" type="submit">Search</button></form></section><p id="message" class="rt-message" role="status" aria-live="polite"></p><section id="results" class="rt-grid rt-grid-3"></section><section class="rt-panel" style="margin-top:20px"><div class="rt-panel-kicker">COMPARE</div><h2>Compare selected pages</h2><p class="rt-muted">Select exactly three profiles, then compare their available information.</p><button id="compare" class="primary" type="button">Compare 3</button><div id="comparison" style="margin-top:18px"></div></section></main><script type="module" src="/search.js"></script></body></html>
