<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReviewTap Platform Admin</title><link rel="stylesheet" href="/styles.css"></head><body><nav><a class="logo" href="/">Review<span>Tap</span></a><span>Private Platform Admin</span></nav><main class="section"><div id="login"><div class="eyebrow">PRIVATE</div><h1>Platform administration</h1><p class="lead">This area is intentionally not linked from the client application.</p><input id="adminKey" type="password" placeholder="Platform admin key"><button class="primary" id="unlock">Unlock</button><p id="adminMessage"></p></div><div id="dashboard" hidden><div class="eyebrow">PLATFORM CONTROL</div><h1>ReviewTap Admin</h1><p id="adminMessage2"></p><div id="overview" class="pricing"></div><section class="portal-section"><h2>Businesses</h2><div id="businesses"></div></section><section class="portal-section"><h2>Onboarding & quotes</h2><div id="onboarding"></div><form id="quoteForm" class="inline-form"><input id="quoteBusinessId" placeholder="Business ID" required><input id="setupMinor" type="number" min="0" placeholder="Setup fee (minor units)"><input id="monthlyMinor" type="number" min="0" placeholder="Monthly retainer (minor units)"><input id="quoteItem" placeholder="Quote item"><button class="primary">Create quote</button></form><p class="small">Amounts are stored in minor currency units (e.g. KES cents).</p></section><section class="portal-section"><h2>NFC inventory</h2><form id="nfcForm" class="inline-form"><input id="inventoryCode" placeholder="NFC-000001" required><input id="nfcBusinessId" placeholder="Business ID"><input id="nfcEndpointId" placeholder="Endpoint ID"><button class="primary">Add tag</button></form><div id="nfc"></div></section></div></main><script type="module" src="/admin.js"></script></body></html>
