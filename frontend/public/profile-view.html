<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReviewTap</title><style>
:root{--ink:#172033;--muted:#667085;--card:#fff;--line:#e6e9ef;--accent:#111827}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#f5f6f8}main{max-width:680px;margin:auto;min-height:100vh;background:var(--card);box-shadow:0 0 40px #0000000d}.cover{height:230px;background:#e8ebf0 center/cover no-repeat;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(#0000,#000)}.wrap{padding:0 22px 32px}.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#e9edf2;border:5px solid white;margin-top:-52px;position:relative;z-index:2}.identity h1{margin:10px 0 4px;font-size:30px}.identity p{margin:0;color:var(--muted)}.status{display:inline-flex;gap:7px;align-items:center;margin-top:10px;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#667085}.dot.open{background:#12b76a}.actions{display:grid;gap:10px;margin:22px 0}.action{border:0;border-radius:14px;padding:15px 16px;font-weight:750;font-size:15px;text-decoration:none;text-align:center;background:var(--accent);color:white;cursor:pointer}.action.alt{background:#eef0f4;color:var(--ink)}.section{padding:22px 0;border-top:1px solid var(--line)}.section h2{font-size:18px;margin:0 0 13px}.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.menu{display:grid;gap:10px}.menuitem{display:grid;grid-template-columns:1fr auto;gap:12px}.menuitem img{width:86px;height:70px;object-fit:cover;border-radius:12px;grid-row:span 2}.price{font-weight:800}.muted{color:var(--muted);font-size:14px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:pointer}.socials{display:flex;flex-wrap:wrap;gap:9px}.socials a{padding:10px 13px;border-radius:999px;background:#eef0f4;color:var(--ink);text-decoration:none;font-weight:650}.pay{display:flex;justify-content:space-between;gap:10px;align-items:center}.copy{border:0;border-radius:10px;padding:9px 12px;cursor:pointer}.footer{text-align:center;color:#98a2b3;padding:24px 0;font-size:13px}.lightbox{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:90vh;border-radius:12px}.error{text-align:center;padding:80px 25px}.hidden{display:none!important}@media(max-width:700px){main{box-shadow:none}.cover{height:205px}.wrap{padding-left:18px;padding-right:18px}}
</style></head><body><main><div id="app"><div class="error">Loading…</div></div></main><div id="lightbox" class="lightbox"><img id="lightboxImage"><button id="closeLightbox" class="action" style="position:absolute;top:18px;right:18px">Close</button></div><script type="module" src="/profile-view.js"></script></body></html>
