<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReviewTap Dashboard</title><link rel="stylesheet" href="/styles.css"></head><body><nav><a class="logo" href="/">Review<span>Tap</span></a><div><button class="ghost" id="logout">Logout</button></div></nav><main class="section"><div class="eyebrow">BUSINESS PORTAL</div><h1 id="welcome">Your ReviewTap workspace</h1><p class="lead">Manage smart endpoints, customer destinations and in-person interactions.</p><p id="message" role="status"></p><div id="stats" class="pricing" style="grid-template-columns:repeat(4,1fr);margin-top:25px"></div><div class="cards" style="grid-template-columns:repeat(2,1fr);margin-top:30px"><article><h3>Business setup</h3><form id="businessForm"><input id="businessName" placeholder="Business name" required><input id="websiteUrl" placeholder="Website URL (optional)"><input id="googleBusinessUrl" placeholder="Google review URL (optional)"><button class="primary" style="margin-top:12px">Save business</button></form></article><article><h3>Create a smart endpoint</h3><form id="endpointForm"><input id="endpointName" placeholder="Endpoint name (e.g. Table 4)" required><input id="endpointCode" placeholder="Unique code (e.g. TABLE_04)" required><select id="endpointType"><option>TABLE</option><option>ROOM</option><option>PRODUCT</option><option>SERVICE</option><option>WAITER</option><option>EVENT</option><option>CUSTOM</option></select><label><input id="allowOrdering" type="checkbox"> Enable guest ordering</label><button class="primary" style="margin-top:12px">Create smart endpoint</button></form></article><article><h3>Product catalogue</h3><form id="productForm"><input id="productName" placeholder="Product name" required><input id="productPrice" type="number" min="0" step="0.01" placeholder="Price" required><button class="primary" style="margin-top:12px">Add product</button></form></article><article><h3>Locations</h3><form id="branchForm"><input id="branchName" placeholder="Location name" required><input id="branchCode" placeholder="Location code" required><input id="branchAddress" placeholder="Address (optional)"><button class="primary" style="margin-top:12px">Add location</button></form></article></div><section style="margin-top:45px"><h2>Smart endpoints</h2><div id="endpoints"></div></section><section style="margin-top:45px"><h2>Catalogue</h2><div id="products"></div></section><section style="margin-top:45px"><h2>Locations</h2><div id="branches"></div></section></main><script type="module" src="/portal.js"></script></body></html>
